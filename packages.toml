# Package manifest: one [[package]] per Chocolatey package managed by chocotools.
# Fields: id (Chocolatey id = nuspec <id>), folder, vendor, major, image (jdk|jre),
# variant (Liberica only: std|full|lite), arch (x64|x86|neutral), frozen, notes,
# package_fix (optional int 1-99: package fix version, see chocotools/versioning.py)
# with package_fix_line (required with package_fix: the "A.B.C" line it was declared for).
# Frozen packages are skipped by sync and publish but still checked by validate
# and compare. Folders listed in `ignore` hold a nuspec but are not managed.

ignore = ["FreeDownloadManager"]

