# Packs, test-installs and pushes changed packages to the Chocolatey community feed.
#
# Secrets:
#   CHOCO_KEY  Chocolatey community API key used by `choco push`.
name: publish

on:
  push:
    branches: [master]
    paths:
      - "**/*.nuspec"
      - "**/tools/**"
  workflow_dispatch:
    inputs:
      ids:
        description: "Package ids to publish (comma-separated)"
        required: true
        type: string
      dry_run:
        description: "Do everything except choco push"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.29"

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Publish changed packages
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          CHOCO_KEY: ${{ secrets.CHOCO_KEY }}
        run: uv run python -m chocotools publish --changed "$env:BEFORE..$env:SHA"

      - name: Publish selected packages (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          IDS: ${{ inputs.ids }}
          CHOCO_KEY: ${{ secrets.CHOCO_KEY }}
        run: uv run python -m chocotools publish --id "$env:IDS" --dry-run

      - name: Publish selected packages
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          IDS: ${{ inputs.ids }}
          CHOCO_KEY: ${{ secrets.CHOCO_KEY }}
        run: uv run python -m chocotools publish --id "$env:IDS"
