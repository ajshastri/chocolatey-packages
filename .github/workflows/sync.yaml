# Daily upstream sync: updates package versions, URLs and sha256 checksums and
# opens (or updates) a single PR from bot/sync into master.
#
# Secrets:
#   GH_PAT  Fine-grained token for this repo with contents:write and
#           pull-requests:write. It is used for checkout, push and the PR so
#           that PR checks (ci.yaml) trigger; pushes made with GITHUB_TOKEN do
#           not trigger workflows. The job's own GITHUB_TOKEN stays read-only.
name: sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      vendor:
        description: "Only sync this vendor (empty = all)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.29"

      - name: Install dependencies
        run: uv sync --locked --no-dev

      # Branch and PR decisions come from `chocotools syncpr plan` (see
      # scripts/chocotools/syncpr.py and tests/test_syncpr.py):
      #   base:  new    no bot/sync yet            -> start from master
      #          reuse  bot/sync has unmerged work -> check it out, merge master
      #          reset  bot/sync merged/equal/behind or conflicting
      #                                            -> start from master
      #   push:  push    normal fast-forward push
      #          replace delete the remote bot/sync, then push it again (the
      #                  rebuilt branch does not descend from the old one).
      #                  This avoids a force-push; the old branch only held
      #                  work that is on master or is regenerated by sync.
      #   pr:    create / edit / keep / close / none ("create" also re-opens a
      #          PR for a branch whose PR was closed unmerged; delete bot/sync
      #          to discard its updates. "close" comments on and closes an
      #          open PR whose branch holds nothing master still needs)
      - name: Find open sync PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          number="$(gh pr list --head bot/sync --base master --state open --json number --jq '.[0].number // empty')"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Plan bot/sync base
        id: prepare
        env:
          OPEN_PR: ${{ steps.pr.outputs.number }}
        run: uv run python -m chocotools syncpr plan --open-pr "$OPEN_PR" --github-output "$GITHUB_OUTPUT"

      - name: Prepare bot/sync branch
        env:
          BASE: ${{ steps.prepare.outputs.base }}
        run: |
          case "$BASE" in
            reuse)
              git checkout -B bot/sync refs/remotes/origin/bot/sync
              git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  merge --no-edit refs/remotes/origin/master
              ;;
            new | reset)
              git checkout -B bot/sync refs/remotes/origin/master
              ;;
            *)
              echo "unknown base: $BASE" >&2
              exit 1
              ;;
          esac

      - name: Sync
        id: sync
        continue-on-error: true
        env:
          VENDOR: ${{ inputs.vendor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m chocotools sync ${VENDOR:+--vendor "$VENDOR"} --report out/sync-report.md

      - name: Plan commit, push and PR
        id: finish
        env:
          OPEN_PR: ${{ steps.pr.outputs.number }}
        run: |
          uv run python -m chocotools syncpr plan --after-sync --open-pr "$OPEN_PR" \
            --report out/sync-report.md --body out/pr-body.md --github-output "$GITHUB_OUTPUT"

      - name: Commit, push and open PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OPEN_PR: ${{ steps.pr.outputs.number }}
          COMMIT: ${{ steps.finish.outputs.commit }}
          PUSH: ${{ steps.finish.outputs.push }}
          PR: ${{ steps.finish.outputs.pr }}
        run: |
          if [ "$COMMIT" = "true" ]; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -am "chore(sync): upstream updates"
          fi
          case "$PUSH" in
            none) ;;
            push)
              git push origin bot/sync
              ;;
            replace)
              # Not a force-push: delete the stale remote branch, then push
              # the branch rebuilt from master.
              git push origin --delete bot/sync
              git push origin bot/sync
              ;;
            *)
              echo "unknown push action: $PUSH" >&2
              exit 1
              ;;
          esac
          case "$PR" in
            none | keep)
              echo "PR: $PR"
              ;;
            edit)
              gh pr edit "$OPEN_PR" --body-file out/pr-body.md
              ;;
            create)
              gh pr create --base master --head bot/sync \
                --title "chore(sync): upstream updates" \
                --body-file out/pr-body.md
              ;;
            close)
              gh pr comment "$OPEN_PR" --body-file out/pr-body.md
              gh pr close "$OPEN_PR"
              ;;
            *)
              echo "unknown PR action: $PR" >&2
              exit 1
              ;;
          esac

      - name: Fail if any package failed to sync
        if: steps.sync.outcome == 'failure'
        run: exit 1
